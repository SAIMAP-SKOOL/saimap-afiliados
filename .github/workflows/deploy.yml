name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del portal
        working-directory: portal
        run: npm ci

      - name: Instalar dependencias de cada nicho
        run: |
          for pkg in sites/*/package.json; do
            [ -e "$pkg" ] || continue
            dir=$(dirname "$pkg")
            echo "Instalando dependencias en $dir"
            npm ci --prefix "$dir"
          done

      - name: Construir portal + nichos
        run: node scripts/build-todo.mjs

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
